[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llplayer-cross"
version = "0.1.0"
description = "Cross-platform LLPlayer for language learning"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "av>=14,<17", "pysubs2>=1.8", "httpx>=0.28", "yt-dlp", "Pillow", "janome==0.5.0", "charset-normalizer>=3.4,<4"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
dev = ["pytest", "pytest-qt", "pyinstaller"]

[project.scripts]
llplayer = "llplayer.app:main"

[tool.setuptools.packages.find]
include = ["llplayer*"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.setuptools.package-data]
llplayer = ["assets/*.svg", "assets/*.png", "assets/*.qss"]
