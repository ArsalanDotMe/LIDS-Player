name: Cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 build-essential pkg-config zlib1g-dev libgnutls28-dev libdav1d-dev nasm tesseract-ocr tesseract-ocr-eng ffmpeg
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install tesseract pkg-config dav1d ffmpeg
      - run: uv sync --python 3.12 --extra asr --extra dev --locked
      - name: Build LGPL-only FFmpeg
        if: runner.os != 'Windows'
        run: uv run --no-sync python scripts/build_lgpl_ffmpeg.py
      - name: Prepare Qt software AV1 decoding
        if: runner.os != 'Windows'
        run: uv run --no-sync python scripts/build_qt_ffmpeg.py
      - name: Rebuild PyAV against audited libraries
        if: runner.os != 'Windows'
        shell: bash
        run: PKG_CONFIG_PATH="$PWD/.tools/ffmpeg/lib/pkgconfig" uv pip install --python .venv/bin/python --no-binary av --reinstall-package av 'av==16.1.0'
      - name: Install FFmpeg for Windows development tests
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Prepare speech and OCR tools
        if: runner.os != 'Windows'
        run: uv run --no-sync python scripts/build_tools.py
      - run: uv run --no-sync python scripts/make_assets.py
      - run: uv run --no-sync python scripts/make_fixture.py
      - run: uv run --no-sync python scripts/make_bitmap_fixture.py
      - name: Generate native format fixtures
        if: runner.os != 'Windows'
        run: uv run --no-sync python scripts/make_format_fixtures.py
      - name: Generate common playback fixtures
        shell: bash
        run: LLPLAYER_FIXTURE_FFMPEG=ffmpeg uv run --no-sync python scripts/make_playback_fixtures.py
      - name: Test native app
        if: runner.os != 'Linux'
        env:
          LLPLAYER_REQUIRE_FORMAT_FIXTURES: '1'
        run: uv run --no-sync pytest -q
      - name: Test Linux app
        if: runner.os == 'Linux'
        env:
          LLPLAYER_REQUIRE_FORMAT_FIXTURES: '1'
        run: xvfb-run -a uv run --no-sync pytest -q
      - name: Verify software playback
        if: runner.os != 'Linux'
        env:
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ','
          LLPLAYER_REQUIRE_FORMAT_FIXTURES: '1'
        run: uv run --no-sync pytest -q tests/test_formats.py
      - name: Verify Linux software playback
        if: runner.os == 'Linux'
        env:
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ','
          LLPLAYER_REQUIRE_FORMAT_FIXTURES: '1'
        run: xvfb-run -a uv run --no-sync pytest -q tests/test_formats.py
      - name: Build audited native package
        if: runner.os != 'Windows'
        run: uv run --no-sync python scripts/build.py
      - name: Verify packaged macOS playback
        if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/verify_playback_formats.py "dist/LIDS Player.app/Contents/MacOS/LIDS Player"
      - name: Verify packaged Linux playback
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync python scripts/verify_playback_formats.py "dist/LIDS Player/LIDS Player"
      - name: Windows packaging status
        if: runner.os == 'Windows'
        run: Write-Output "Windows source tests run, but binary packaging is held until native dependency licenses and a Windows LGPL build are audited."
      - name: Archive native package
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "LIDS-Player-${{ runner.os }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: LIDS-Player-${{ runner.os }}
          path: LIDS-Player-${{ runner.os }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" packages/LIDS-Player-macOS/LIDS-Player-macOS.tar.gz packages/LIDS-Player-Linux/LIDS-Player-Linux.tar.gz --generate-notes
