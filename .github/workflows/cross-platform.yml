name: Source checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0 libpulse0 ffmpeg tesseract-ocr
      - name: Install macOS runtime
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract
      - name: Install Windows fixture encoder
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --python 3.12.13 --extra asr --extra dev --locked
      - run: uv run --no-sync python scripts/make_assets.py
      - run: uv run --no-sync python scripts/make_fixture.py
      - run: uv run --no-sync python scripts/make_bitmap_fixture.py
      - name: Test source app
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest -q --ignore=tests/test_formats.py
      - name: Check Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd .venv/lib/python3.12/site-packages/PySide6/Qt/plugins/platforms/libqxcb.so | tee /tmp/qt-libraries.txt
          if grep -q 'not found' /tmp/qt-libraries.txt; then exit 1; fi
      - name: Test Linux source app
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync pytest -q --ignore=tests/test_formats.py
